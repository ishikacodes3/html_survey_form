<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="survey.css">
</head>
<body>
    <form action="push">
        <fieldset>
            <h1>Survey Form</h1>
            <h3>A simple survey with multiple options.</h3>
            <fieldset>
                <div>
                <p>1.What is your favourite subject?</p>
                 </div>
                <input type="checkbox" id="Math">
                <label for="subject">Math</label>
                <input type="checkbox">Science
                <input type="checkbox">English
                <input type="checkbox">Computer
                <div>
                <p>2.Which devices do you use?</p>
                 </div>
                <input type="checkbox" id="Mobile">
                <label for="Mobile">Mobile</label>
                <input type="checkbox">Laptop
                <input type="checkbox">Tablet
                <input type="checkbox">Desktop
                <div>
                    <p>3.Any suggestion?</p>
                    <textarea placeholder="Your suggestion..." rows="3" cols="45"></textarea>
                    <br><br>
                </div>
               <input type="submit" style="background-color: rgb(245, 169, 76);" size="230">
            </fieldset>
        </fieldset>
    </form>
</body>
</html>
